<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nobi 游戏 · 好友联机</title><link rel="stylesheet" href="ui/online.css"></head><body>
<header><a href="game.html">返回大厅</a><span id="connection" role="status">正在检查环境</span><button id="retry" hidden>重新连接</button><button id="signout" hidden>退出账号</button></header>
<button id="room-controls-toggle" aria-expanded="false" aria-label="打开房间操作">房间 / 退出</button>
<main><section id="setup"><h1>好友联机</h1><p id="environment">独立测试环境 · 可选本地竞技积分</p><form id="login"><label>测试邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><div id="rooms" hidden><label>游戏<select id="kind"><option value="guandan">掼蛋 · 四人</option><option value="go">围棋 · 双人</option></select></label><label><input id="competitive" type="checkbox">竞技测试（只计入隔离赛季，掼蛋双副牌，支持连续升级）</label><button id="create">创建房间</button><section class="room-directory" aria-label="已创建房间"><div class="directory-heading"><h2>已创建的房间</h2><button id="refresh-rooms">刷新</button></div><label>筛选游戏<select id="room-filter"><option value="">全部游戏</option><option value="guandan">掼蛋</option><option value="go">围棋</option></select></label><p id="room-list-status" role="status">正在加载房间</p><ul id="room-list"></ul><div class="directory-pages"><button id="rooms-prev">上一页</button><span id="rooms-page"></span><button id="rooms-next">下一页</button></div></section><label>房间号<input id="room-input" placeholder="输入好友的完整房间号" maxlength="36"></label><button id="join">加入房间</button></div></section>
<section id="session" hidden><div class="room-bar"><label>房间号<input id="room-code" readonly aria-label="当前房间号"></label><button id="copy">复制</button><span id="players"></span><span id="clock"></span><button id="start">开始对局</button></div><ul id="room-roster" aria-label="房间座位"></ul><div id="game-frame"></div><div class="operations"><button id="pass">虚着</button><button id="undo">申请整轮悔棋</button><button id="accept" hidden>同意悔棋</button><button id="reject" hidden>拒绝悔棋</button><button id="resign">申请认输</button><button id="confirm" hidden>确认认输</button><button id="cancel" hidden>取消申请</button><button id="leave">退出并结束对局</button><button id="next-round" hidden>进入下一副 · 继承等级</button><button id="new-room" hidden>创建下一局</button></div><section id="scoring" hidden><h2>数子确认 · 白贴 7.5 目</h2><p>死子与中立空区必须双方同意；有争议请恢复落子。坐标不含 I，例如 A19,B19，需填写整块全部坐标。</p><label>死子坐标<input id="dead-points" placeholder="无死子则留空"></label><label>中立空区坐标<input id="neutral-points" placeholder="无额外中立区则留空"></label><p id="score-summary"></p><div class="operations"><button id="score-propose">提交数子方案</button><button id="score-confirm">同意对方方案并结算</button><button id="score-dispute">不同意方案</button><button id="resume-play">恢复落子</button></div></section><p id="result"></p><p id="settled-result"></p><a href="game.html#/rank">查看排行榜与战绩</a></section><p id="notice" role="alert"></p></main>
<script src="vendor/supabase.js"></script><script src="build-target.js"></script><script src="platform.js"></script><script src="config.local.js"></script><script src="config.js"></script><script src="supabaseClient.js"></script><script src="online-config.js"></script><script src="ui/request-timeout.js"></script><script src="ui/online.js"></script></body></html>
