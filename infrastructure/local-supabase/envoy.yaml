static_resources:
  listeners:
    - name: local_api
      address: {socket_address: {address: 0.0.0.0, port_value: 8000}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: local_api
                upgrade_configs: [{upgrade_type: websocket}]
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: {prefix: /auth/v1/}
                          route: {cluster: auth, prefix_rewrite: /}
                        - match: {prefix: /rest/v1/}
                          route: {cluster: rest, prefix_rewrite: /}
                        - match: {prefix: /realtime/v1/api/}
                          route: {cluster: realtime, prefix_rewrite: /api/, host_rewrite_literal: realtime-dev.localhost}
                        - match: {prefix: /realtime/v1/}
                          route: {cluster: realtime, prefix_rewrite: /socket/, host_rewrite_literal: realtime-dev.localhost, timeout: 0s}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  clusters:
    - name: auth
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: auth
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: auth, port_value: 9999}}}}]}]
    - name: rest
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: rest
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: rest, port_value: 3000}}}}]}]
    - name: realtime
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: realtime
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: realtime, port_value: 4000}}}}]}]
