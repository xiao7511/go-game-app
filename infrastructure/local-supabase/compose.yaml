name: nobi-phase3a-local
services:
  db:
    image: supabase/postgres:17.6.1.136
    pull_policy: never
    container_name: supabase_db_nobi-phase3a-local
    labels:
      com.nobi.project: nobi-phase3a-local
    ports: ["127.0.0.1:55422:5432"]
    environment:
      POSTGRES_PASSWORD: ${NOBI_LOCAL_DB_PASSWORD:?generated by local-compose.mjs}
      PGPASSWORD: ${NOBI_LOCAL_DB_PASSWORD}
      POSTGRES_DB: postgres
      JWT_EXP: "3600"
    volumes:
      - nobi-db:/var/lib/postgresql/data
      - ./sql/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-nobi-roles.sql:ro
      - ./sql/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-nobi-realtime.sql:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: supabase/gotrue:v2.196.0
    pull_policy: never
    labels:
      com.nobi.project: nobi-phase3a-local
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:55421/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${NOBI_LOCAL_DB_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:5178
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${NOBI_LOCAL_JWT_SECRET}
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "200"
      GOTRUE_RATE_LIMIT_SIGN_UPS: "200"
  rest:
    image: postgrest/postgrest:v14.17
    pull_policy: never
    labels:
      com.nobi.project: nobi-phase3a-local
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${NOBI_LOCAL_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,game
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${NOBI_LOCAL_JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
  realtime:
    image: supabase/realtime:v2.134.10
    pull_policy: never
    labels:
      com.nobi.project: nobi-phase3a-local
    depends_on:
      db: {condition: service_healthy}
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${NOBI_LOCAL_DB_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${NOBI_LOCAL_REALTIME_ENCRYPTION}
      API_JWT_SECRET: ${NOBI_LOCAL_JWT_SECRET}
      SECRET_KEY_BASE: ${NOBI_LOCAL_SECRET_BASE}
      METRICS_JWT_SECRET: ${NOBI_LOCAL_JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
  gateway:
    image: envoyproxy/envoy:v1.39.1
    pull_policy: never
    labels:
      com.nobi.project: nobi-phase3a-local
    ports: ["127.0.0.1:55421:8000"]
    depends_on: [auth, rest, realtime]
    volumes: ["./envoy.yaml:/etc/envoy/envoy.yaml:ro"]
volumes:
  nobi-db:
    name: nobi-phase3a-local-db
    labels:
      com.nobi.project: nobi-phase3a-local
