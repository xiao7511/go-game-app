# Insert into the existing HTTPS virtual host, then nginx -t before reload.
# Frontend NOBI_ONLINE_URL is https://supabase-game.nobistudio.com/nobi-online.
large_client_header_buffers 4 16k;
location = /nobi-online { return 308 /nobi-online/; }
location /nobi-online/ {
    proxy_pass http://127.0.0.1:55480/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 70s;
    client_max_body_size 16k;
}
