# Include inside the existing api.nobistudio.com HTTPS server.
# The upstream remains the existing game project; no account/database migration.
location = /nobi-online/auth { return 308 /nobi-online/auth/; }
location /nobi-online/auth/ {
    proxy_pass https://kogjjfccyncdszuuwlun.supabase.co/auth/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host kogjjfccyncdszuuwlun.supabase.co;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name kogjjfccyncdszuuwlun.supabase.co;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    client_max_body_size 16k;
    access_log /var/log/nginx/nobi-auth.access.log nobi_auth_safe;
}
